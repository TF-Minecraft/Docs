name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    outputs:
      artifact-name: ${{ steps.package.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            projects/CoreProtect/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Test documentation link checker
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check documentation links and navigation
        run: python scripts/check-indexes.py
      - name: Build CoreProtect documentation
        working-directory: projects/CoreProtect
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/coreprotect-site"
      - name: Package documentation
        id: package
        env:
          BUILD_VERSION: ${{ inputs.version }}
          SITE_DIR: ${{ runner.temp }}/coreprotect-site
        run: python3 .github/scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
