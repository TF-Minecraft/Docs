name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            projects/CoreProtect/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Test documentation link checker
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check documentation links and navigation
        run: python scripts/check-indexes.py
      - name: Build CoreProtect documentation
        working-directory: projects/CoreProtect
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/coreprotect-site"
